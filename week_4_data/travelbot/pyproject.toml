[project]
name = "context-to-state-workshop"
version = "0.1.0"
description = "Workshop: from prompt context to agent state. A travel planner whose requirements change mid-task."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0",
    "anthropic>=1.15,<2",
    "openai>=3.35,<4",
]

[project.optional-dependencies]
gui = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
workshop = "workshop.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workshop", "solutions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
